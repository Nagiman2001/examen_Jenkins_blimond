{{- range $name, $config := dict "movie-service" .Values.movieService "cast-service" .Values.castService }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  type: {{ $config.service.type }}
  ports:
    - name: http
      port: {{ $config.service.port }}
      targetPort: 8000
      nodePort: {{ $config.service.nodePort }}
      protocol: TCP
  selector:
    app: {{ $name }}
---
{{- end }}
