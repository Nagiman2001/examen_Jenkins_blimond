{{- range $db := list
  (dict "name" "movie-db" "database" "movie_db_dev" "user" "movie_db_username" "password" "movie_db_password")
  (dict "name" "cast-db" "database" "cast_db_dev" "user" "cast_db_username" "password" "cast_db_password")
}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $db.name }}
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: {{ $db.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $db.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $db.name }}
  template:
    metadata:
      labels:
        app: {{ $db.name }}
    spec:
      containers:
        - name: postgres
          image: postgres:12.1-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $db.database | quote }}
            - name: POSTGRES_USER
              value: {{ $db.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ $db.password | quote }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
{{- end }}
