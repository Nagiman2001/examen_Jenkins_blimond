{{- range $name, $config := dict "movie-service" .Values.movieService "cast-service" .Values.castService }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "asyncio"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- if eq $name "movie-service" }}
            - name: DATABASE_URI
              value: "postgresql://movie_db_username:movie_db_password@movie-db:5432/movie_db_dev"
            - name: CAST_SERVICE_HOST_URL
              value: "http://cast-service:8000/api/v1/casts/"
            {{- else }}
            - name: DATABASE_URI
              value: "postgresql://cast_db_username:cast_db_password@cast-db:5432/cast_db_dev"
            {{- end }}
---
{{- end }}
